<!DOCTYPE html>
<html>
<head>
    <title>Simple JavaScript CRUD</title>
</head>
    <body>
            <h1>Student CRUD System</h1>

            <input type="hidden" id="editIndex" value="-1">

        <label>Student Name:</label>
            <input type="text" id="studentName">
            <br><br>

        <label>Course:</label>
            <input type="text" id="studentCourse">
            <br><br>

        <label>Student ID:</label>
            <input type="number" id="studentId">
            <br><br>

        <input type="button" onclick="saveStudent()" value="Save Student">
            <button onclick="clearForm()">Cancel</button>
            <hr>

        <h2>Student Records</h2>

        <!--Search Button-->
        <hr>
        <label>
        Search Student:
            <input type="text" id="studentSearch">
            <input type="button" id="search" onclick="searchStudent()" value="Search">
            <input type="button" id="showAll" onclick="showAllstudents()" value="Show all">

            <!--sort button-->
            <input type="button" value="A-Z" onClick="sortStudents();">
            <br><br>
        </label>

        <table border="1" cellpadding="10">
            <thead>
                <tr>
                    <th>Number</th>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>
        </table>

        <!-- Student Countt-->
        <p id="studentCount">Total Students: 0</p>

        <script>
            // Array used as temporary storage
            let students = [];
            let searchResult = [];


            // CREATE and UPDATE
            function saveStudent() {
                let name = document.getElementById("studentName").value;
                let course = document.getElementById("studentCourse").value;
                let studentid = (document.getElementById("studentId").value);
                let editIndex = parseInt(document.getElementById("editIndex").value);

                if (name == "" || course == "") {
                    alert("Please complete all fields.");
                    return;
                }

                //Validaation for Duplicate entrres of id
                for (let i = 0; i < students.length; i++) {
                    if (students[i].studentid == studentid && i != editIndex) {
                        alert("Student id already exist")

                        document.getElementById("studentId").value = "";
                        return;
                    }
                }


                if (editIndex == -1) {
                    // CREATE
                    let newStudent = {
                        name: name,
                        course: course,
                        studentid: studentid
                    };

                    // Add data without using push()
                    students[students.length] = newStudent;
                    alert("Student added successfully.");
                } else {
                    // UPDATE
                    students[editIndex].studentid = studentid;
                    students[editIndex].name = name;
                    students[editIndex].course = course;
                    alert("Student updated successfully.");
                }

                clearForm();
                displayStudents();
            }


            // READ
            function displayStudents() {
                let table = document.getElementById("studentTable");
                let count = document.getElementById("studentCount");

                table.innerHTML = "";

                if (students.length == 0) {
                    table.innerHTML = "<tr>"
                        + "<td colspan='6'>No student records found.</td>"
                        + "</tr>";

                    //Count the total students in the table
                    count.innerHTML = "Total Students: 0";
                    return;
                }

                for (let index = 0; index < students.length; index++) {
                    table.innerHTML +=
                        "<tr>" +
                        "<td>" + (index + 1) + "</td>" +
                        "<td>" + students[index].studentid + "</td>" +
                        "<td>" + students[index].name + "</td>" +
                        "<td>" + students[index].course + "</td>" +
                        "<td>" +
                        "<button onclick='editStudent(" + index + ")'>Edit</button> " +
                        "<button onclick='deleteStudent(" + index + ")'>Delete</button>" +
                        "</td>" +
                        "</tr>";
                }

                count.innerHTML = "Total Students: " + students.length;
            }


            // Select a student for editing
            function editStudent(index) {
                document.getElementById("studentName").value = students[index].name;
                document.getElementById("studentCourse").value = students[index].course;
                document.getElementById("studentId").value = students[index].studentid;
                document.getElementById("editIndex").value = index;
            }


            // DELETE
            function deleteStudent(index) {
                let answer = confirm("Are you sure you want to delete this student?");

                if (answer == false) {
                    return;
                }

                /*
                    Move every item after the selected index
                    one position to the left.
                */
                for (let position = index; position < students.length - 1; position++) {
                    students[position] = students[position + 1];
                }

                // Reduce the array length to remove the last duplicate item
                students.length = students.length - 1;

                clearForm();
                displayStudents();
                alert("Student deleted successfully.");
            }


            // Clear the input fields
            function clearForm() {
                document.getElementById("studentName").value = "";
                document.getElementById("studentCourse").value = "";
                document.getElementById("studentId").value = "";
                document.getElementById("editIndex").value = "-1";
            }


            // Initially display the empty table
            displayStudents();


            // SEARCH STUDENT
            function searchStudent() {
                let search = document.getElementById("studentSearch").value;
                let table = document.getElementById("studentTable");
                let count = document.getElementById("studentCount");

                table.innerHTML = "";
                searchResult = []; //Show table of searched data


                let found = false;

                for (let i = 0; i < students.length; i++) {

                    if (students[i].name.toLowerCase() == search.toLowerCase() ||
                        students[i].course.toLowerCase() == search.toLowerCase() ||
                        students[i].studentid == search) {

                        searchResult[searchResult.length] = students[i];

                        found = true;
                    }
                }

                //count total searched if a user search
                count.innerHTML = "Total Searched Students: " + searchResult.length;


                if (found == false) {
                    table.innerHTML = "<tr><td colspan='5'>No Student found.</td></tr>";
                    return;
                }

                for (let i = 0; i < searchResult.length; i++) {

                    table.innerHTML +=
                        "<tr>" +
                        "<td>" + (i + 1) + "</td>" +
                        "<td>" + searchResult[i].studentid + "</td>" +
                        "<td>" + searchResult[i].name + "</td>" +
                        "<td>" + searchResult[i].course + "</td>" +
                        "<td>" +
                        "<button>Edit</button> " +
                        "<button>Delete</button>" +
                        "</td>" +
                        "</tr>";
                }
            }

            // SORT A-Z (sorted byn name "bubble sort")
            function sortStudents() {

                if (searchResult.length > 0) {

                    for (let i = 0; i < searchResult.length - 1; i++) {
                        for (let j = 0; j < searchResult.length - 1 - i; j++) {

                            if (searchResult[j].name > searchResult[j + 1].name) {

                                let temp = searchResult[j];
                                searchResult[j] = searchResult[j + 1];
                                searchResult[j + 1] = temp;

                            }
                        }
                    }

                    let table = document.getElementById("studentTable");
                    table.innerHTML = "";

                    for (let i = 0; i < searchResult.length; i++) {

                        table.innerHTML +=
                            "<tr>" +
                            "<td>" + (i + 1) + "</td>" +
                            "<td>" + searchResult[i].studentid + "</td>" +
                            "<td>" + searchResult[i].name + "</td>" +
                            "<td>" + searchResult[i].course + "</td>" +
                            "<td>" +
                            "<button>Edit</button> " +
                            "<button>Delete</button>" +
                            "</td>" +
                            "</tr>";
                    }

                } else {

                    for (let i = 0; i < students.length - 1; i++) {
                        for (let j = 0; j < students.length - 1 - i; j++) {

                            if (students[j].name > students[j + 1].name) {

                                let temp = students[j];
                                students[j] = students[j + 1];
                                students[j + 1] = temp;

                            }
                        }
                    }

                    displayStudents();
                }
            }

            //for button show all table, if user wants to show all table after searching 
            function showAllstudents() {
                document.getElementById("studentSearch").value = "";

                searchResult = [];
                displayStudents();
            }
        </script>
    </body>
</html>
